<style>
body {
  font-family: 'Nanum Myeongjo';
  margin: 0;
  background: #fff;
  color: #333;
}

/* HEADER */
header {
  background: #fff;
  border-bottom: 2px solid #e0e0e0;
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-family: 'Times New Roman', serif;
  margin: 0;
}

nav ul {
  display: flex;
  gap: 1rem;
  list-style: none;
}

nav a {
  text-decoration: none;
  color: #2c3e50;
}

/* BACK BUTTON */
.back-link {
  position: fixed;
  top: 90px;
  left: 20px;
  background: #eaeaea;
  padding: 8px 12px;
  border-radius: 6px;
  text-decoration: none;
  z-index: 2000;
}

/* MASONRY GALLERY */
.gallery {
  column-count: 3;
  column-gap: 18px;
  padding: 20px;
}

@media (max-width: 1000px) {
  .gallery { column-count: 2; }
}

@media (max-width: 600px) {
  .gallery { column-count: 1; }
}

.gallery a {
  display: inline-block;
  width: 100%;
  margin-bottom: 18px;
  break-inside: avoid;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
  transition: transform 0.25s ease;
}

.gallery img:hover {
  transform: scale(1.02);
}

/* WATERMARK */
.watermark {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 12px;
  color: white;
  background: rgba(0,0,0,0.4);
  padding: 3px 6px;
  border-radius: 4px;
}
</style>
</head>
