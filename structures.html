  <style>
    body {
      font-family: 'Nanum Myeongjo';
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      color: #333;
      line-height: 1.6;
    }

    .back-link {
      position: fixed;
      top: 90px;
      left: 20px;
      font-size: 0.9em;
      text-decoration: none;
      color: #333;
      background: #eaeaea;
      padding: 8px 12px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s ease-in-out;
      z-index: 2000;
    }

    .back-link:hover { background: #ccc; }

    header {
      background: #ffffff;
      border-bottom: 2px solid #e0e0e0;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 1.5rem;
      color: #2c3e50;
      font-family: 'Times New Roman', serif;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
    }

    .gallery {
      column-count: 3;
      column-gap: 20px;
      padding: 20px;
    }

    @media (max-width: 1000px) { .gallery { column-count: 2; } }
    @media (max-width: 600px) { .gallery { column-count: 1; } }

    .gallery a {
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
      break-inside: avoid;
      text-decoration: none;
    }

    .img-container {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .img-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .watermark {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 12px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 3px 6px;
      border-radius: 3px;
      pointer-events: none;
    }
  </style>
</head>
