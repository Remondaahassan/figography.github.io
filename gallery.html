
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery | Figeographie</title>

  <link rel="stylesheet" href="mobile.css">

  <!-- Lightbox2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nanum Myeongjo', serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      color: #333;
      line-height: 1.6;
    }

    /* ---------- HEADER ---------- */

    header {
      background: #ffffff;
      border-bottom: 2px solid #e0e0e0;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #2c3e50;
      font-family: 'Times New Roman', serif;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      transition: background 0.3s;
    }

    nav a:hover,
    nav a.active {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .hamburger {
      display: none;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #2c3e50;
    }

    /* ---------- GALLERY ---------- */

    main h1 {
      text-align: center;
      font-size: 2rem;
      margin: 30px 0;
      color: #2c3e50;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 500px);
      gap: 30px;
      justify-content: center;
      padding: 30px;
    }

    .category-card {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .img-container {
      position: relative;
      width: 500px;
      height: 500px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .category-card:hover .img-container {
      transform: scale(1.03);
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-header {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;

  background: rgba(0, 0, 0, 0.55);
  color: white;

  text-align: center;
  padding: 20px 0;

  font-size: 1.8rem;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

    footer {
      text-align: center;
      margin: 30px 0 15px;
      font-size: 14px;
      color: #666;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 1100px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .img-container {
        width: 300px;
        height: 300px;
        margin: 0 auto;
      }
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      nav {
        display: none;
        position: absolute;
        top: 70px;
        right: 0;
        width: 100%;
        background: white;
        border-top: 1px solid #e0e0e0;
      }

      nav.open {
        display: block;
      }

      nav ul {
        flex-direction: column;
        padding: 0.75rem 1rem;
      }
    }

    @media (max-width: 600px) {
      .img-container {
        width: 100%;
        max-width: 350px;
        height: 250px;
      }

      .category-header {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Figeographie</h1>

  <button class="hamburger" aria-label="Toggle navigation">
    ☰
  </button>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="articles.html">Articles</a></li>
      <li><a href="charity.html">Magdi Yacoub Heart Foundation</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="team.html">Our Team</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Gallery</h1>

  <div class="gallery">

    <a href="plants.html" class="category-card">
      <div class="img-container">
        <img src="seneca_wattanapanich/mushrooms.jpg" alt="Plants">
        <div class="category-header">Plants</div>
      </div>
    </a>

    <a href="animals.html" class="category-card">
      <div class="img-container">
        <img src="kai_pedrosa/bird.JPG" alt="Animals">
        <div class="category-header">Animals</div>
      </div>
    </a>

    <a href="landscapes.html" class="category-card">
      <div class="img-container">
        <img src="cate_wells/geyser.JPG" alt="Landscapes">
        <div class="category-header">Landscapes</div>
      </div>
    </a>

    <a href="structures.html" class="category-card">
      <div class="img-container">
        <img src="cate_wells/Antelope Canyon 5.jpg" alt="Structures">
        <div class="category-header">Structures</div>
      </div>
    </a>

  </div>
</main>

<footer>
  <p>© 2025 Figeographie. All rights reserved.</p>
</footer>

<script>
  const hamburger = document.querySelector('.hamburger');
  const nav = document.querySelector('nav');

  hamburger.addEventListener('click', () => {
    nav.classList.toggle('open');
  });
</script>

</body>
</html>
```
